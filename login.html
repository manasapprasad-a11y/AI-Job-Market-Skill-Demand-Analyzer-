<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI-Driven Job Market Skill Demand Analyzer</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">

    <!-- Glowing Background Blobs -->
    <div class="bg-glow-container">
        <div class="glow-blob glow-blob-1"></div>
        <div class="glow-blob glow-blob-2"></div>
        <div class="glow-blob glow-blob-3"></div>
    </div>

    <!-- Login Container -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card login-card text-center p-5">
                    <!-- Typing Header -->
                    <h3 class="mb-4" id="typewriterHeader">AI-Driven Job Market Skill Demand Analyzer</h3>
                    <p class="text-details-custom mb-4">Analyze Skills • Explore Careers • Build Your Future</p>

                    <form id="loginForm">
                        <div class="mb-3 text-start">
                            <label for="inputFullName" class="form-label text-muted-custom">Full Name</label>
                            <input type="text" class="form-control form-control-glass" id="inputFullName" placeholder="Enter your name" required autocomplete="off">
                        </div>
                        <div class="mb-3 text-start">
                            <label for="inputEmail" class="form-label text-muted-custom">Email Address</label>
                            <input type="email" class="form-control form-control-glass" id="inputEmail" placeholder="name@example.com" required autocomplete="off">
                        </div>
                        <div class="mb-4 text-start">
                            <label for="inputPassword" class="form-label text-muted-custom">Password</label>
                            <input type="password" class="form-control form-control-glass" id="inputPassword" placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn btn-neon-purple w-100 py-3 mb-2">Initialize System</button>
                    </form>
                    
                    <div class="mt-4 text-details-custom" style="font-size: 0.82rem;">
                        Secure client-side session environment. No data leaves your machine.
                    </div>
                    <div class="mt-3 text-details-custom" style="font-size: 0.75rem;">
                        © 2026 AI-Driven Job Market Skill Demand Analyzer. All Rights Reserved.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Javascript Controller -->
    <script src="js/script.js"></script>
</body>
</html>
